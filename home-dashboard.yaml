- type: vertical-stack
  cards:
  - type: custom:mushroom-template-card
    primary: Pohyb v obývačke
    secondary: "{% if is_state('binary_sensor.pohybovy_senzor_obyvacka_pohyb', 'on')  %}   \n  Pohyb práve teraz!   \n{% else\
      \ %}   \n  Posledný pohyb: {{ relative_time(states.binary_sensor.pohybovy_senzor_obyvacka_pohyb.last_changed) }} dozadu\n\
      {% endif %}   \n"
    icon: "{% if is_state('binary_sensor.pohybovy_senzor_obyvacka_pohyb', 'on')  %}   \n  mdi:run-fast   \n{% else %}   \n\
      \  mdi:walk   \n{% endif %}   \n"
    icon_color: "{% if is_state('binary_sensor.pohybovy_senzor_obyvacka_pohyb', 'on')  %}   \n  amber   \n{% else %}   \n\
      \  grey   \n{% endif %}   \n"
    badge_icon: "{% if is_state('binary_sensor.pohybovy_senzor_obyvacka_pohyb', 'on')  %}   \n  mdi:motion-sensor   \n\n{%\
      \ else %}   \n  mdi:sleep   \n{% endif %}   \n"
    badge_color: "{% if is_state('binary_sensor.pohybovy_senzor_obyvacka_pohyb', 'on')  %}   \n  red   \n{% else %}   \n \
      \ green   \n{% endif %}   \n"
    layout: horizontal
    tap_action:
      action: more-info
  - type: custom:apexcharts-card
    graph_span: 24h
    span:
      start: day
    header:
      show: false
    series:
    - entity: binary_sensor.pohybovy_senzor_obyvacka_pohyb
      type: column
      name: Počet detekcií
      transform: 'return x === ''on'' ? 1 : 0;'
      group_by:
        func: sum
        duration: 20min
      color_threshold:
      - value: 0
