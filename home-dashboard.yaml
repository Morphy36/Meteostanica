      \  let shadowColor = 'rgba(0,0,0,0)'; \n  let iconShadow = 'drop-shadow(0px 0px 0px rgba(0,0,0,0))'; \n\n  if (entity.state\
      \ === 'on') { \n    if (entity.attributes.rgb_color) { \n      let rgb = entity.attributes.rgb_color; \n      shadowColor\
      \ = `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, 0.6)`; \n      iconColor = `rgb(${rgb[0]}, ${rgb[1]}, ${rgb[2]})`; \n   \
