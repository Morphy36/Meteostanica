substitutions:
  dev_name: "vonkajsia-stanica"
  friendly_name: "Meteostanica 1"
  altitude_meters: "430"
  batt_multiplier: "2.0"
  batt_min_voltage: "3.0"
  batt_max_voltage: "4.2"
  sleep_storm_mode_ms: "120000"
  sleep_normal_mode_ms: "600000"
  sleep_eco_mode_ms: "1800000"
  sleep_perf_mode_ms: "300000"
  sleep_failsafe: "4min"
  rain_calib_dry: "0.300"
  rain_calib_wet: "0.140"
  wind_pullup_res: "4700"
  wifi_ap_timeout: "1min"
  wind_storm_threshold: "15.0"
  bat_eco_threshold: "20.0"
  bat_storm_min: "30.0"
  bat_perf_threshold: "80.0"
  rain_moisture_threshold: "15.0"   # zvýšený prah proti šumu
  frost_temp_threshold: "3.0"
  storm_pressure_drop: "-2.5"
  rain_trend_threshold: "-1.5"   # hPa/h — prah pre "tlak klesá" v predikcii dažďa
esphome:
  name: ${dev_name}
  friendly_name: ${friendly_name}
  project:
    name: "custom.meteostanica"
    version: "3.8.0"
  on_boot:
    priority: 600
    then:
      - script.execute: failsafe_guard
      - lambda: |-
          id(boot_count) += 1;
          ESP_LOGI("boot", "=== BOOT #%d ===", id(boot_count));
      - output.turn_on: rain_sensor_power
      - output.turn_on: i2c_sensor_power
      - delay: 2000ms
      - script.execute: init_i2c_sensors
      - if:
          condition:
            lambda: 'return id(i2c_initialized);'
          then:
            - component.update: bme280_sensor
            - delay: 150ms
            - component.update: bme280_sensor
            - delay: 150ms
            - component.update: bme280_sensor
            - delay: 100ms
      - component.update: battery_voltage
      - component.update: sht41_sensor
      - component.update: ltr390_sensor
      # Boot guard: počkáme 10s kým sa kábel ustáli, až potom povolíme počítanie zrážok
      - delay: 10000ms
      - lambda: 'id(rain_boot_ready) = true;'
      - script.execute: wifi_connect_logic
  on_shutdown:
    then:
      - logger.log:
          level: INFO
          tag: "shutdown"
          format: "Vypínam senzory a idem spať."
      - script.execute: uspat_ltr390
      - output.turn_off: rain_sensor_power
      - output.turn_off: i2c_sensor_power
esp32:
  board: esp32dev
  framework:
    type: arduino
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  output_power: 8.5dBm
  ap:
    ssid: "Meteo Stanica AP"
    password: "MeteoStanicaAP"
    ap_timeout: ${wifi_ap_timeout}
  on_connect:
    then:
      - logger.log:
          level: INFO
          tag: "wifi"
          format: "WiFi OK."
      - lambda: 'id(wifi_fail_count) = 0;'
  on_disconnect:
    then:
      - lambda: |-
          id(wifi_fail_count) += 1;
          ESP_LOGW("wifi", "WiFi odpojené. Zlyhaní za sebou: %d", id(wifi_fail_count));
api:
  id: api_server
  reboot_timeout: 0s
  on_client_connected:
    then:
      - logger.log:
          level: INFO
          tag: "api"
          format: "HA klient pripojený."
      - script.stop: failsafe_guard
  on_client_disconnected:
    then:
      - logger.log:
          level: INFO
          tag: "api"
          format: "HA klient odpojený."
ota:
  platform: esphome
logger:
  level: INFO      # DEBUG len dočasne pri ladení — spomaľuje boot a míňa batériu
  baud_rate: 0
i2c:
  sda: GPIO22
  scl: GPIO21
  scan: false
  id: busa
  frequency: 100kHz
  timeout: 50ms
globals:
  - id: pressure_history
    type: float[6]
    restore_value: true
    initial_value: "{NAN, NAN, NAN, NAN, NAN, NAN}"
  - id: history_index
    type: int
    restore_value: true
    initial_value: "0"
  - id: pressure_time_index
    type: int[6]
    restore_value: true
    initial_value: "{0, 0, 0, 0, 0, 0}"
  - id: pressure_trend_value
    type: float
    restore_value: true
    initial_value: "0.0"
  - id: prev_humidity
    type: float
    restore_value: true
    initial_value: "NAN"
  - id: pressure_threshold
    type: float
    restore_value: true
    initial_value: ${rain_trend_threshold}
  - id: humidity_threshold
    type: float
    restore_value: true
    initial_value: "80.0"
  - id: i2c_restart_attempts
    type: int
    restore_value: false
    initial_value: "0"
  - id: i2c_initialized
    type: bool
    restore_value: false
    initial_value: "false"
  - id: boot_count
    type: int
    restore_value: true
    initial_value: "0"
  - id: last_sleep_mode
    type: int
    restore_value: true
    initial_value: "0"
  - id: wifi_fail_count
    type: int
    restore_value: true
    initial_value: "0"
  - id: sensor_error_count
    type: int
    restore_value: true
    initial_value: "0"
  - id: humidity_stuck_count
    type: int
    restore_value: true    # prežije deep sleep — sleduje dlhodobé zaseknutie
    initial_value: "0"
  - id: last_humidity_value
    type: float
    restore_value: true    # posledné meranie SHT41 — detekcia zaseknutého senzora
    initial_value: "NAN"
  - id: last_rain_total
    type: float
    restore_value: false   # pulse_counter total sa po každom boote vynuluje
    initial_value: "0.0"
  - id: pressure_logged_this_boot
    type: bool
    restore_value: false   # zabráni viacnásobnému zápisu tlaku do histórie v jednom boote
    initial_value: "false"
  - id: hum_rising_boot
    type: bool
    restore_value: false   # "vlhkosť stúpa oproti minulému cyklu" — vypočítané raz za boot
    initial_value: "false"
  - id: daily_rain_accumulator
    type: float
    restore_value: true
    initial_value: "0.0"
  - id: rain_boot_ready
    type: bool
    restore_value: false
    initial_value: "false"  # blokuje počítanie zrážok počas prvých 10s po boote
  - id: ota_mode_active
    type: bool
    restore_value: true     # uložené v NVS — prežije deep sleep
    initial_value: "false"
  - id: last_sleep_duration_s
    type: float
    restore_value: true
    initial_value: "600.0"
sensor:
  - platform: bme280_i2c
    address: 0x76
    i2c_id: busa
    id: bme280_sensor
    update_interval: never
    temperature:
      name: "Teplota BME280"
      id: bme280_temperature
      entity_category: diagnostic
      oversampling: 4x
    pressure:
      name: "Absolútny tlak"
      id: bme280_pressure
      oversampling: 4x
      filters:
        - lambda: |-
            if (x < 800.0f || x > 1100.0f) {
              ESP_LOGW("bme280", "Odmietnutý tlak: %.1f hPa", x);
              return {};
            }
            return x;
      on_value:
        then:
          - lambda: |-
              float h = ${altitude_meters};
              float t = id(sht41_temperature).has_state() ? id(sht41_temperature).state :
                        (id(bme280_temperature).has_state() ? id(bme280_temperature).state : 15.0f);
              float msl = x * pow(1.0f - (0.0065f * h) / (t + 0.0065f * h + 273.15f), -5.257f);
              id(msl_pressure).publish_state(msl);
          - script.execute: update_pressure_trend
    humidity:
      name: "Vlhkosť BME280"
      id: bme280_humidity
      entity_category: diagnostic
      oversampling: 4x
  - platform: sht4x
    address: 0x44
    i2c_id: busa
    id: sht41_sensor
    update_interval: never
    temperature:
      name: "Vonkajšia Teplota"
      id: sht41_temperature
      filters:
        - lambda: |-
            if (x < -40.0f || x > 60.0f) {
              ESP_LOGW("sht41", "Odmietnutá teplota: %.1f°C", x);
              return {};
            }
            return x;
    humidity:
      name: "Vonkajšia Vlhkosť"
      id: sht41_humidity
      filters:
        - lambda: |-
            if (x < 0.0f || x > 100.0f) {
              ESP_LOGW("sht41", "Odmietnutá vlhkosť: %.1f%%", x);
              return {};
            }
            return x;
        - exponential_moving_average:
            alpha: 0.3
            send_every: 1
  - platform: ltr390
    address: 0x53
    i2c_id: busa
    id: ltr390_sensor
    update_interval: never
    gain: "X3"
    resolution: 18
    light:
      name: "Intenzita svetla"
      id: ambient_light
      filters:
        - lambda: 'return (x < 0.0f) ? 0.0f : x;'
    uv:
      name: "UV Index (RAW)"
      id: uv_raw_data
      internal: true
  - platform: adc
    pin: GPIO35
    name: "Napätie batérie"
    id: battery_voltage
    update_interval: never
    attenuation: 12db
    accuracy_decimals: 2
    filters:
      - multiply: ${batt_multiplier}
      - median:
          window_size: 5
          send_every: 1
          send_first_at: 1
      - lambda: |-
          if (x < 2.5f || x > 5.0f) {
            ESP_LOGW("battery", "Podozrivé napätie: %.2fV", x);
            return {};
          }
          return x;
  - platform: adc
    pin: GPIO34
    id: rain_sensor_voltage
    name: "Napätie dažďového senzora"
    entity_category: diagnostic
    update_interval: never
    attenuation: 12db
    filters:
      - median:
          window_size: 7
          send_every: 1
          send_first_at: 1
  - platform: template
    name: "Vlhkosť dažďového senzora"
    id: rain_sensor_percent
    unit_of_measurement: "%"
    icon: "mdi:water-percent"
    state_class: measurement
    update_interval: never
    lambda: |-
      if (!id(rain_sensor_voltage).has_state()) return NAN;
      float val = id(rain_sensor_voltage).state;
      float dry = ${rain_calib_dry};
      float wet = ${rain_calib_wet};
      if (fabsf(dry - wet) < 0.01f) return NAN;
      return clamp((val - dry) / (wet - dry) * 100.0f, 0.0f, 100.0f);
  - platform: pulse_counter
    pin:
      number: GPIO25
      mode: INPUT_PULLUP
    name: "Rýchlosť vetra (Priemer)"
    id: wind_speed
    unit_of_measurement: "km/h"
    device_class: wind_speed
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 3s
    use_pcnt: false
    internal_filter: 3ms       # znížené z 20ms — 20ms filtrovalo reálne pulzy pri rýchlejšom vetre a dlhom kábli
    filters:
      - multiply: 0.04
      - lambda: 'return (x < 0.3f) ? 0.0f : x;'
  - platform: copy
    source_id: wind_speed
    name: "Rýchlosť vetra (Náraz-Gust)"
    id: wind_gust
    device_class: wind_speed
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - max:
          window_size: 5
          send_every: 1
          send_first_at: 1
  - platform: pulse_counter
    pin:
      number: GPIO26
      mode: INPUT_PULLUP
    name: "Intenzita zrážok"
    id: rain_fall_rate
    unit_of_measurement: "mm/h"
    device_class: precipitation_intensity
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 60s
    use_pcnt: false
    internal_filter: 500ms     # zvýšené z 200ms — 3m kábel pri boote generuje kapacitívne falošné pulzy
    filters:
      - multiply: 16.764
    total:
      name: "Zrážky (tento cyklus)"
      id: rain_total
      unit_of_measurement: "mm"
      accuracy_decimals: 2
      device_class: precipitation
      state_class: measurement    # NIE total_increasing — počítadlo sa nuluje po každom deep sleep
      filters:
        - multiply: 0.2794
      on_value:
        then:
          - lambda: |-
              // pulse_counter total sa nuluje pri každom boote, preto akumulujeme prírastky
              if (!id(rain_boot_ready)) {
                ESP_LOGW("rain", "Boot guard aktívny — ignorujem pulzy (%.2f mm)", x);
                id(last_rain_total) = x;
                return;
              }
              float delta = x - id(last_rain_total);
              if (delta < 0.0f) delta = x;          // počítadlo sa medzitým vynulovalo
              if (delta > 0.0f) {
                id(daily_rain_accumulator) += delta;
                ESP_LOGI("rain", "+%.2f mm → kumulatívne %.2f mm", delta, id(daily_rain_accumulator));
              }
              id(last_rain_total) = x;
  - platform: adc
    pin: GPIO33
    id: wind_vane_voltage
    name: "Napätie veternej ruže (debug)"
    entity_category: diagnostic
    internal: false
    update_interval: never     # manuálne volané 3× v read_all_sensors pre plnenie median filtra
    attenuation: 12db
    filters:
      - median:
          window_size: 5
          send_every: 1
          send_first_at: 1
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1
  - platform: template
    name: "Smer vetra (Uhol)"
    id: wind_direction_angle
    unit_of_measurement: "°"
    icon: "mdi:compass-rose"
    update_interval: never     # default 60s by nikdy nevyšiel — stanica je hore len ~20-30s
    lambda: |-
      if (!id(wind_vane_voltage).has_state()) return NAN;
      float v = id(wind_vane_voltage).state;
      if (v < 0.05f) return NAN;  // odstránená závislosť na wind_speed — smer musí fungovať aj pri pokoji
      float r_vane = ${wind_pullup_res} * ((3.3f / v) - 1.0f);
      struct WindDir { float resistance; float angle; };
      static const WindDir dirs[] = {
        {688,112.5},{891,67.5},{1000,90},{1410,157.5},
        {2200,135},{3140,202.5},{3900,180},{6570,22.5},
        {8200,45},{14120,247.5},{16000,225},{21880,337.5},
        {33000,0},{42120,292.5},{64900,315},{120000,270}
      };
      float min_ratio = 1000.0f;
      float best_angle = NAN;
      for (int i = 0; i < 16; i++) {
        float ratio = abs(r_vane - dirs[i].resistance) / dirs[i].resistance;
        if (ratio < min_ratio) { min_ratio = ratio; best_angle = dirs[i].angle; }
      }
      if (min_ratio > 0.30f) {
        ESP_LOGW("wind_dir", "Neznámy odpor: %.0f Ohm", r_vane);
        return NAN;
      }
      return best_angle;
  - platform: template
    name: "Tlak (Hladina mora)"
    id: msl_pressure
    unit_of_measurement: "hPa"
    accuracy_decimals: 1
    icon: "mdi:gauge"
    device_class: atmospheric_pressure
    state_class: measurement
    update_interval: never    # publikuje sa z on_value BME280 tlaku
  - platform: template
    name: "Tlakový trend"
    id: pressure_trend_sensor
    unit_of_measurement: "hPa/h"
    accuracy_decimals: 2
    icon: "mdi:trending-down"
    state_class: measurement
    update_interval: never
    lambda: 'return id(pressure_trend_value);'
  - platform: template
    name: "Rosný bod"
    id: dew_point
    unit_of_measurement: "°C"
    icon: "mdi:thermometer-water"
    device_class: temperature
    state_class: measurement
    update_interval: never
    lambda: |-
      if (!id(sht41_temperature).has_state() || !id(sht41_humidity).has_state()) return NAN;
      float T = id(sht41_temperature).state;
      float RH = id(sht41_humidity).state;
      if (RH <= 0.0f) return NAN;
      float a = 17.27f, b = 237.7f;
      float alpha = ((a * T) / (b + T)) + log(RH / 100.0f);
      if (fabsf(a - alpha) < 0.001f) return NAN;
      return (b * alpha) / (a - alpha);
  - platform: template
    name: "Absolútna vlhkosť"
    id: absolute_humidity
    unit_of_measurement: "g/m³"
    accuracy_decimals: 1
    icon: "mdi:water"
    state_class: measurement
    update_interval: never
    lambda: |-
      if (!id(sht41_temperature).has_state() || !id(sht41_humidity).has_state()) return NAN;
      float T = id(sht41_temperature).state;
      float RH = id(sht41_humidity).state;
      float es = 6.112f * exp((17.67f * T) / (T + 243.5f));
      return ((RH / 100.0f) * es * 216.7f) / (T + 273.15f);  // oprava: 2165 → 216.7 (bola 10× chyba)
  - platform: template
    name: "Index tepelného komfortu"
    id: comfort_index
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    icon: "mdi:thermometer-check"
    state_class: measurement
    update_interval: never
    lambda: |-
      if (!id(sht41_temperature).has_state() || !id(sht41_humidity).has_state()) return NAN;
      float T = id(sht41_temperature).state;
      float RH = id(sht41_humidity).state;
      return T - (0.55f - 0.0055f * RH) * (T - 14.5f);
  - platform: template
    name: "Pocitová teplota"
    id: feels_like_temp
    unit_of_measurement: "°C"
    icon: "mdi:thermometer-lines"
    device_class: temperature
    state_class: measurement
    update_interval: never
    lambda: |-
      if (!id(sht41_temperature).has_state() || !id(sht41_humidity).has_state()) return NAN;
      float t = id(sht41_temperature).state;
      float h = id(sht41_humidity).state;
      if (isnan(t) || isnan(h)) return NAN;
      float v = (id(wind_speed).has_state() && !isnan(id(wind_speed).state)) ? id(wind_speed).state : 0.0f;
      if (t <= 10.0f && v >= 4.8f)
        return 13.12f + (0.6215f*t) - (11.37f*pow(v,0.16f)) + (0.3965f*t*pow(v,0.16f));
      if (t >= 26.0f && h >= 40.0f) {
        float hi = -8.785f + 1.611f*t + 2.339f*h - 0.146f*t*h
                   - 0.013f*t*t - 0.016f*h*h + 0.002f*t*t*h
                   + 0.001f*t*h*h - 0.000004f*t*t*h*h;
        return max(hi, t);
      }
      return t;
  - platform: template
    name: "UV Index"
    id: uv_index_calc
    unit_of_measurement: "UVI"
    accuracy_decimals: 1
    icon: "mdi:sun-wireless"
    state_class: measurement
    update_interval: never
    lambda: |-
      if (!id(uv_raw_data).has_state()) return NAN;
      float raw = id(uv_raw_data).state;
      if (raw <= 0.0f) return 0.0f;
      float uvi = raw / 170.0f;
      if (uvi > 15.0f) { ESP_LOGW("uv","Nereálny UVI: %.1f",uvi); return NAN; }
      return uvi;
  - platform: template
    name: "Úroveň batérie"
    id: battery_level
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never
    lambda: |-
      if (!id(battery_voltage).has_state()) return NAN;
      float v = id(battery_voltage).state;
      // Ak napätie < 2.9V — GPIO35 pláva bez batérie, vráť NAN (neznáme)
      if (v < 2.9f) return NAN;
      if (v >= 4.15f) return 100.0f;
      if (v >= 4.0f)  return 85.0f  + (v - 4.0f)  * 100.0f;
      if (v >= 3.75f) return 35.0f  + (v - 3.75f) * 200.0f;
      if (v >= 3.5f)  return 10.0f  + (v - 3.5f)  * 100.0f;
      if (v >= 3.3f)  return 2.0f   + (v - 3.3f)  * 40.0f;
      if (v >= ${batt_min_voltage}) return 1.0f;
      return 0.0f;
  - platform: internal_temperature
    name: "Teplota CPU"
    id: cpu_temperature        # 'internal_temperature' je rezervované meno ESPHome — použijeme cpu_temperature
    entity_category: diagnostic
    update_interval: never
  - platform: uptime
    name: "Čas behu"
    id: uptime_sensor
    update_interval: 1s
    entity_category: diagnostic
  - platform: wifi_signal
    name: "WiFi Signál dBm"
    id: wifi_signal_dbm
    update_interval: never
    entity_category: diagnostic
  - platform: copy
    source_id: wifi_signal_dbm
    name: "Kvalita WiFi"
    unit_of_measurement: "%"
    entity_category: diagnostic
    filters:
      - lambda: |-
          if (x <= -100.0f) return 0.0f;
          if (x >= -50.0f)  return 100.0f;
          return 2.0f * (x + 100.0f);
  - platform: template
    name: "Počet bootov"
    entity_category: diagnostic
    accuracy_decimals: 0
    lambda: 'return (float)id(boot_count);'
  - platform: template
    name: "WiFi zlyhania (za sebou)"
    entity_category: diagnostic
    accuracy_decimals: 0
    lambda: 'return (float)id(wifi_fail_count);'
  - platform: template
    name: "Chyby senzorov"
    entity_category: diagnostic
    accuracy_decimals: 0
    lambda: 'return (float)id(sensor_error_count);'
  - platform: template
    name: "Zrážky spolu"
    id: rain_cumulative
    unit_of_measurement: "mm"
    accuracy_decimals: 2
    icon: "mdi:cup-water"
    device_class: precipitation
    state_class: total_increasing    # prežíva deep sleep, nuluje sa len cez "Reset diagnostiky"
    update_interval: never
    lambda: 'return id(daily_rain_accumulator);'
  - platform: template
    name: "Zaseknutá vlhkosť (počet)"
    id: humidity_stuck_sensor
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: never
    lambda: 'return (float)id(humidity_stuck_count);'
binary_sensor:
  - platform: status
    name: "Status Stanice"
  - platform: template
    name: "Detekcia dažďa"
    id: rain_detection
    device_class: moisture
    lambda: |-
      bool analog = id(rain_sensor_percent).has_state() &&
                    !isnan(id(rain_sensor_percent).state) &&
                    id(rain_sensor_percent).state > ${rain_moisture_threshold};
      bool bucket = id(rain_fall_rate).has_state() &&
                    id(rain_fall_rate).state > 0.5f;
      return analog || bucket;
    filters:
      - delayed_on: 5s    # analógová doštička šumí; delayed_off nemá zmysel — stav neprežije deep sleep
  - platform: template
    name: "Kritická batéria"
    id: low_battery
    device_class: battery
    lambda: |-
      if (!id(battery_voltage).has_state() || isnan(id(battery_voltage).state)) return false;
      return id(battery_voltage).state < (${batt_min_voltage} + 0.1f);
  - platform: template
    name: "Riziko mrazu"
    id: frost_risk
    icon: "mdi:snowflake-alert"
    lambda: |-
      if (!id(sht41_temperature).has_state() || !id(dew_point).has_state()) return false;
      float t = id(sht41_temperature).state;
      float dp = id(dew_point).state;
      if (isnan(t) || isnan(dp)) return false;
      return (t < ${frost_temp_threshold}) && (dp < 0.0f);
    # Bez delayed_on: rosný bod aj teplota sa počas jedného bdenia počítajú práve raz,
    # takže filter nemal čo vyhladzovať — iba oddialil publikovanie stavu za deep sleep.
  - platform: template
    name: "Výstraha: Búrka"
    id: storm_warning
    icon: "mdi:weather-lightning-rainy"
    # Bez delayed_on: pressure_trend_value je regresia cez niekoľko hodín (už vyhladená)
    # a počas jedného bdenia sa nemení. Pôvodných 60 s bolo presne na hranici uptime,
    # pri ktorej stanica zaspáva — výstraha sa preto publikovala len náhodne.
    lambda: 'return id(pressure_trend_value) < ${storm_pressure_drop};'
  - platform: template
    name: "Predikcia dažďa (Tlak)"
    id: rain_prediction
    icon: "mdi:weather-rainy"
    # Čistá funkcia. Lambda binárneho senzora beží v KAŽDOM loop() (stovky × za sekundu),
    # takže pôvodná verzia prepisovala celý 6-prvkový buffer pressure_history tou istou
    # aktuálnou hodnotou a prev_humidity nastavovala na aktuálnu vlhkosť — trend tým vychádzal
    # nula a hum_rising nikdy nenastalo. Zápis histórie je teraz v update_pressure_trend (1× za boot).
    lambda: |-
      if (!id(sht41_humidity).has_state() || isnan(id(sht41_humidity).state)) return false;
      float hum = id(sht41_humidity).state;
      float trend = id(pressure_trend_value);
      if (trend < ${storm_pressure_drop}) return true;
      // Použij MSL tlak (normalizovaný na hladinu mora) — absolútny tlak pri 430 m
      // je vždy ~965 hPa, čo by falošne spúšťalo podmienku s hranicou 1010 hPa.
      if (id(msl_pressure).has_state() && !isnan(id(msl_pressure).state) &&
          id(msl_pressure).state < 1010.0f && hum > id(humidity_threshold)) return true;
      int valid = 0; float sum = 0.0f;
      for (int i = 0; i < 6; i++) {
        if (!isnan(id(pressure_history)[i]) && id(pressure_history)[i] > 800.0f) {
          sum += id(pressure_history)[i]; valid++;
        }
      }
      if (valid < 2) return false;
      if (!id(bme280_pressure).has_state() || isnan(id(bme280_pressure).state)) return false;
      float avg = sum / valid;
      // pressure_threshold je nastaviteľný cez entitu "Prah poklesu tlaku"
      return trend < id(pressure_threshold) && id(bme280_pressure).state < avg && id(hum_rising_boot);
  - platform: template
    name: "Chyba I2C senzorov"
    id: i2c_error_flag
    device_class: problem
    entity_category: diagnostic
    lambda: 'return !id(i2c_initialized) || id(humidity_stuck_count) >= 5;'
text_sensor:
  - platform: template
    name: "Odporúčanie oblečenia"
    id: clothing_recommendation
    icon: "mdi:hanger"
    update_interval: never
    lambda: |-
      if (!id(sht41_temperature).has_state()) return std::string("Načítavam...");
      float t    = id(sht41_temperature).state;
      float uvi  = id(uv_index_calc).has_state() ? id(uv_index_calc).state : 0.0f;
      float wind = id(wind_speed).has_state() ? id(wind_speed).state : 0.0f;
      float lux  = id(ambient_light).has_state() ? id(ambient_light).state : -1.0f;
      bool rain  = id(rain_prediction).state || id(rain_detection).state;
      bool frost = id(frost_risk).state;
      bool windy = wind > 25.0f;
      bool highUV = uvi >= 6.0f;
      bool daytime = lux > 50.0f;
      bool cloudy  = daytime && lux < 5000.0f;
      bool sunny   = daytime && lux >= 20000.0f;
      if (frost) return std::string("🧊 Pozor na mráz! Protišmykové topánky, rukavice.");
      if (rain) {
        if (t < 3)  return std::string("🥶 Ľadový dážď! Zimná bunda, dáždnik, pozor na námrazu!");
        if (t < 10) return std::string("🌧️ Prší a je zima. Zimná bunda + dáždnik.");
        if (t < 20) return std::string("🌦️ Prší. Nepremokavá bunda.");
        return std::string("⛈️ Teplý dážď. Ľahká bunda + dáždnik.");
      }
      if (t < -5) return std::string("🧊 Tuhý mráz! Vrstvy, zimná bunda, čiapka, šál, rukavice.");
      if (t < 5)  return std::string("❄️ Mráz! Zimná bunda, čiapka, rukavice.");
      if (t < 15) {
        if (windy && cloudy) return std::string("💨 Chladno, veterno a zamračené. Vetrovka + sveter.");
        if (windy)  return std::string("💨 Chladno a veterno. Vetrovka + sveter.");
        if (cloudy) return std::string("☁️ Chladno a zamračené. Sveter a bunda.");
        return std::string("🧥 Chladno. Sveter a bunda.");
      }
      if (t < 22) {
        if (cloudy) return std::string("⛅ Príjemne, ale zamračené. Ľahká bunda alebo mikina.");
        return std::string("👕 Príjemne. Mikina alebo tričko.");
      }
      if (t < 30) {
        if (cloudy) return std::string("☁️ Teplo ale bez slnka. Tričko, môžeš zabudnúť krém.");
        if (highUV && sunny) return std::string("☀️ Teplo + silné UV! Tričko, opaľovací krém SPF50+, klobúk.");
        if (sunny)  return std::string("☀️ Teplo a slnečno. Tričko, nezabudni na opaľovací krém.");
        return std::string("🌤️ Teplo. Tričko.");
      }
      if (cloudy) return std::string("🌥️ Horúco aj pod mraky. Naľahko, veľa pitia.");
      return std::string("🔥 Horúčava a slnko! Naľahko, veľa pitia, hľadaj tieň, SPF50+.");
  - platform: template
    name: "Smer vetra (Text)"
    id: wind_dir_text
    update_interval: never
    lambda: |-
      if (!id(wind_direction_angle).has_state()) return std::string("N/A");
      float angle = id(wind_direction_angle).state;
      if (isnan(angle)) return std::string("Neurčený");
      const char* dirs[] = {"S","SSV","SV","VSV","V","VJV","JV","JJV","J","JJZ","JZ","ZJZ","Z","ZSZ","SZ","SSZ"};
      return std::string(dirs[(int)((angle + 11.25f) / 22.5f) % 16]);
  - platform: template
    name: "Sila vetra (Beaufort)"
    id: wind_beaufort_text
    icon: "mdi:weather-windy"
    update_interval: never
    lambda: |-
      if (!id(wind_speed).has_state()) return std::string("N/A");
      float v = id(wind_speed).state;
      if (v < 1.0f)  return std::string("0 – Ticho");
      if (v < 5.0f)  return std::string("1 – Slabý vánek");
      if (v < 12.0f) return std::string("2-3 – Ľahký vietor");
      if (v < 20.0f) return std::string("4 – Mierny vietor");
      if (v < 29.0f) return std::string("5 – Čerstvý vietor");
      if (v < 39.0f) return std::string("6 – Silný vietor");
      if (v < 50.0f) return std::string("7 – Mierny štorm");
      if (v < 62.0f) return std::string("8 – Čerstvý štorm");
      if (v < 75.0f) return std::string("9 – Silný štorm");
      return std::string("10+ – BÚRKA ⚠️");
  - platform: template
    name: "Intenzita zrážok (Text)"
    id: rain_intensity_text
    icon: "mdi:weather-pouring"
    update_interval: never
    lambda: |-
      if (!id(rain_fall_rate).has_state() || !id(rain_detection).state) return std::string("Bez dažďa");
      float r = id(rain_fall_rate).state;
      if (r < 2.5f)  return std::string("🌂 Mrholenie");
      if (r < 7.5f)  return std::string("🌧️ Ľahký dážď");
      if (r < 15.0f) return std::string("🌧️ Mierny dážď");
      if (r < 30.0f) return std::string("⛈️ Silný dážď");
      return std::string("⛈️ PRÍVALOVÝ DÁŽĎ ⚠️");
  - platform: template
    name: "Predpoveď počasia"
    id: weather_forecast_text
    icon: "mdi:weather-partly-cloudy"
    update_interval: never
    lambda: |-
      bool storm  = id(storm_warning).state;
      bool rain_p = id(rain_prediction).state;
      bool rain_d = id(rain_detection).state;
      bool frost  = id(frost_risk).state;
      float trend = id(pressure_trend_value);
      float uvi   = id(uv_index_calc).has_state() ? id(uv_index_calc).state : 0.0f;
      float t     = id(sht41_temperature).has_state() ? id(sht41_temperature).state : NAN;
      float lux   = id(ambient_light).has_state() ? id(ambient_light).state : -1.0f;
      // Obloha podľa svetla (len cez deň)
      bool daytime      = lux > 50.0f;
      bool very_cloudy  = daytime && lux < 500.0f;    // tmavé mraky
      bool cloudy       = daytime && lux < 5000.0f;   // zamračené
      bool partly_cloudy= daytime && lux < 20000.0f;  // čiastočne zamračené
      bool sunny        = daytime && lux >= 20000.0f; // jasno
      if (storm)  return std::string("⛈️ Búrka! Rýchly pokles tlaku.");
      if (rain_d) {
        if (very_cloudy) return std::string("🌧️ Prší, tmavé mraky.");
        return std::string("🌧️ Momentálne prší.");
      }
      if (rain_p) {
        if (cloudy) return std::string("🌦️ Zamračené — možný dážď.");
        return std::string("🌦️ Predpoveď: Možný dážď.");
      }
      if (frost)  return std::string("🧊 Hrozí mráz — pozor na poľadovicu.");
      if (!isnan(t)) {
        if (trend > 1.0f) {
          if (sunny)           return std::string("☀️ Vyjasňuje sa, slnečno.");
          if (partly_cloudy)   return std::string("⛅ Vyjasňuje sa, čiastočne zamračené.");
          return std::string("⛅ Vyjasňuje sa.");
        }
        if (trend < -1.0f) {
          if (very_cloudy)     return std::string("☁️ Zhoršovanie, tmavé mraky.");
          if (cloudy)          return std::string("🌥️ Zhoršovanie, zamračené.");
          return std::string("🌤️ Zhoršovanie počasia.");
        }
        // Stabilný tlak — obloha rozhoduje
        if (sunny && uvi >= 6.0f) return std::string("☀️ Jasno, silné UV žiarenie.");
        if (sunny)               return std::string("☀️ Jasno a slnečno.");
        if (partly_cloudy)       return std::string("⛅ Čiastočne zamračené.");
        if (cloudy)              return std::string("☁️ Zamračené.");
        if (very_cloudy)         return std::string("☁️ Silne zamračené.");
        if (uvi >= 3.0f)         return std::string("☀️ Jasno, stabilný tlak.");
      }
      return std::string("🌡️ Stabilné počasie.");
  - platform: template
    name: "Režim stanice"
    id: station_mode_text
    icon: "mdi:sleep"
    entity_category: diagnostic
    lambda: |-
      switch(id(last_sleep_mode)) {
        case 1: return std::string("⛈️ STORM (2 min)");
        case 2: return std::string("🔋 ECO (30 min)");
        case 3: return std::string("🚀 PERF (5 min)");
        default: return std::string("🔄 Normal (10 min)");
      }
output:
  - platform: gpio
    pin: GPIO18
    id: rain_sensor_power
  - platform: gpio
    pin: GPIO19
    id: i2c_sensor_power
switch:
  - platform: template
    name: "Manuálne napájanie senzorov"
    optimistic: true
    entity_category: config
    turn_on_action:
      - output.turn_on: rain_sensor_power
      - output.turn_on: i2c_sensor_power
    turn_off_action:
      - output.turn_off: rain_sensor_power
      - output.turn_off: i2c_sensor_power
  - platform: template
    name: "OTA Režim (predĺžené budenie)"
    id: ota_mode_switch
    icon: "mdi:update"
    entity_category: config
    lambda: 'return id(ota_mode_active);'
    turn_on_action:
      - lambda: |-
          id(ota_mode_active) = true;
          ESP_LOGI("ota", "OTA režim aktivovaný — pri ďalšom boote zostanem hore 3 min.");
    turn_off_action:
      - lambda: 'id(ota_mode_active) = false;'
  - platform: template
    name: "Vynútiť Deep Sleep"
    icon: "mdi:sleep"
    entity_category: config
    turn_on_action:
      - deep_sleep.enter: deep_sleep_control
  - platform: restart
    name: "Reštartovať Stanicu"
    entity_category: config
  - platform: template
    name: "Reset počítadla zrážok"
    icon: "mdi:water-off"
    entity_category: config
    # Samostatný reset zrážok — vo v3.0 to bolo dedikované tlačidlo a chýbalo tu.
    turn_on_action:
      - lambda: |-
          id(daily_rain_accumulator) = 0.0f;
          id(last_rain_total) = 0.0f;
          ESP_LOGI("rain", "Kumulatívny súčet zrážok vynulovaný.");
      - component.update: rain_cumulative
  - platform: template
    name: "Reset diagnostiky"
    icon: "mdi:restore"
    entity_category: config
    turn_on_action:
      - lambda: |-
          id(sensor_error_count) = 0;
          id(wifi_fail_count) = 0;
          id(i2c_restart_attempts) = 0;
          id(humidity_stuck_count) = 0;
          id(last_humidity_value) = NAN;
          id(daily_rain_accumulator) = 0.0f;
          id(last_rain_total) = 0.0f;
          ESP_LOGI("diag", "Diagnostické počítadlá a akumulátor zrážok resetované.");
number:
  - platform: template
    name: "Prah poklesu tlaku"
    id: pressure_threshold_config
    unit_of_measurement: "hPa"
    min_value: -5.0
    max_value: 0.0
    step: 0.1
    initial_value: ${rain_trend_threshold}
    optimistic: true
    entity_category: config
    set_action:
      - lambda: 'id(pressure_threshold) = x;'
  - platform: template
    name: "Prah vlhkosti pre dážď"
    id: humidity_threshold_config
    unit_of_measurement: "%"
    min_value: 60.0
    max_value: 95.0
    step: 1.0
    initial_value: 80.0
    optimistic: true
    entity_category: config
    set_action:
      - lambda: 'id(humidity_threshold) = x;'
deep_sleep:
  id: deep_sleep_control
script:
  - id: failsafe_guard
    mode: restart
    then:
      - delay: ${sleep_failsafe}
      - logger.log:
          level: ERROR
          tag: "failsafe"
          format: "Failsafe! Boot #%d → Núdzový spánok 10 min."
          args: ['id(boot_count)']
      - output.turn_off: rain_sensor_power
      - output.turn_off: i2c_sensor_power
      - lambda: 'id(sensor_error_count) += 1;'
      - deep_sleep.enter:
          id: deep_sleep_control
          sleep_duration: 10min
  - id: init_i2c_sensors
    mode: single
    then:
      - lambda: |-
          id(i2c_initialized) = false;
          id(i2c_restart_attempts) = 0;
      - script.execute: check_bme280_chip
      - delay: 200ms
      - if:
          condition:
            lambda: 'return id(i2c_initialized);'
          then:
            - logger.log:
                level: INFO
                tag: "i2c"
                format: "I2C inicializácia OK."
          else:
            - logger.log:
                level: WARN
                tag: "i2c"
                format: "I2C zlyhalo → Power cycle..."
            - lambda: 'id(i2c_restart_attempts) += 1;'
            - output.turn_off: i2c_sensor_power
            - delay: 500ms
            - output.turn_on: i2c_sensor_power
            - delay: 2000ms
            - script.execute: check_bme280_chip
            - delay: 200ms
            - if:
                condition:
                  lambda: 'return id(i2c_initialized);'
                then:
                  - logger.log:
                      level: INFO
                      tag: "i2c"
                      format: "I2C OK po power cycle (pokusov: %d)."
                      args: ['id(i2c_restart_attempts)']
                else:
                  - logger.log:
                      level: ERROR
                      tag: "i2c"
                      format: "I2C NEDOSTUPNÉ! Stanica pobeží bez BME280."
                  - lambda: 'id(sensor_error_count) += 1;'
  - id: wifi_connect_logic
    then:
      - wait_until:
          condition: wifi.connected
          timeout: 30s
      - if:
          condition: wifi.connected
          then:
            - wait_until:
                condition:
                  api.connected:
                timeout: 30s
            - if:
                condition: api.connected
                then:
                  - script.execute: read_all_sensors
                  - if:
                      condition:
                        lambda: 'return id(ota_mode_active);'
                      then:
                        - logger.log:
                            level: INFO
                            tag: "ota"
                            format: "OTA režim — zostanem hore 3 minúty pre aktualizáciu."
                        - delay: 3min
                        - lambda: 'id(ota_mode_active) = false;'
                  # Počkaj kým uptime dosiahne 60s — daj HA čas spracovať dáta
                  - wait_until:
                      condition:
                        lambda: 'return id(uptime_sensor).state >= 60.0f;'
                      timeout: 120s
                  - script.execute: check_and_enter_deep_sleep
                else:
                  - if:
                      condition:
                        lambda: 'return id(ota_mode_active);'
                      then:
                        # Pozor: `script.execute: wifi_connect_logic` odtiaľto bol NO-OP —
                        # skript beží (mode: single), takže rekurzívne spustenie sa zahodilo.
                        - logger.log:
                            level: INFO
                            tag: "ota"
                            format: "OTA režim — API ešte nepripojené, čakám max. 3 min."
                        - wait_until:
                            condition:
                              api.connected:
                            timeout: 3min
                        - if:
                            condition: api.connected
                            then:
                              - script.execute: read_all_sensors
                              - delay: 3min
                              - lambda: 'id(ota_mode_active) = false;'
                              - script.execute: check_and_enter_deep_sleep
                            else:
                              - logger.log:
                                  level: WARN
                                  tag: "ota"
                                  format: "OTA režim — API stále nedostupné → spím 5 min."
                              - deep_sleep.enter:
                                  id: deep_sleep_control
                                  sleep_duration: 5min
                      else:
                        - logger.log:
                            level: WARN
                            tag: "wifi"
                            format: "API nedostupné → Spím 5 min."
                        - lambda: 'id(wifi_fail_count) += 1;'
                        - deep_sleep.enter:
                            id: deep_sleep_control
                            sleep_duration: 5min
          else:
            - lambda: 'id(wifi_fail_count) += 1;'
            - logger.log:
                level: WARN
                tag: "wifi"
                format: "WiFi zlyhalo (pokus #%d)."
                args: ['id(wifi_fail_count)']
            - if:
                condition:
                  lambda: 'return id(wifi_fail_count) >= 5;'
                then:
                  - logger.log:
                      level: ERROR
                      tag: "wifi"
                      format: "5× WiFi zlyhalo → Spím 30 min."
                  - deep_sleep.enter:
                      id: deep_sleep_control
                      sleep_duration: 30min
                else:
                  - deep_sleep.enter:
                      id: deep_sleep_control
                      sleep_duration: 5min
  - id: read_all_sensors
    then:
      - if:
          condition:
            lambda: 'return id(i2c_initialized);'
          then:
            - component.update: bme280_sensor
            - component.update: sht41_sensor
            - component.update: ltr390_sensor
          else:
            - logger.log:
                level: WARN
                tag: "sensors"
                format: "I2C nie je OK, preskakujem BME280/SHT41/LTR390."
      - component.update: battery_voltage
      - component.update: rain_sensor_voltage
      - component.update: wifi_signal_dbm
      - component.update: cpu_temperature
      # wind vane: 3 čítania s oneskorením aby median + SMA filter mali dostatok vzoriek
      - component.update: wind_vane_voltage
      - delay: 50ms
      - component.update: wind_vane_voltage
      - delay: 50ms
      - component.update: wind_vane_voltage
      - delay: 200ms
      # smer vetra vypočítame až po naplnení filtra
      - component.update: wind_direction_angle
      - component.update: rain_sensor_percent
      # Watchdog: SHT41 sa vie "zaseknúť" a vracať stále tú istú hodnotu
      - lambda: |-
          if (id(sht41_humidity).has_state() && !isnan(id(sht41_humidity).state)) {
            float h = id(sht41_humidity).state;
            if (!isnan(id(last_humidity_value)) && fabsf(h - id(last_humidity_value)) < 0.001f) {
              id(humidity_stuck_count) += 1;
              ESP_LOGW("sht41", "Vlhkosť nezmenená (%.2f%%) už %d meraní za sebou.",
                       h, id(humidity_stuck_count));
              if (id(humidity_stuck_count) == 5) id(sensor_error_count) += 1;
            } else {
              id(humidity_stuck_count) = 0;
            }
            id(last_humidity_value) = h;
            // Porovnanie s minulým cyklom musí prebehnúť skôr, než prepíšeme prev_humidity
            id(hum_rising_boot) = !isnan(id(prev_humidity)) && (h - id(prev_humidity)) > 2.0f;
          }
      # 1) odvodené veličiny (závisia od surových senzorov)
      - component.update: dew_point
      - component.update: absolute_humidity
      - component.update: comfort_index
      - component.update: feels_like_temp
      - component.update: uv_index_calc
      - component.update: battery_level
      - component.update: pressure_trend_sensor
      # 2) binárne senzory sa vyhodnocujú samy v každom loop(); stačí nechať
      #    dobehnúť ich delayed_on filtre skôr, než ich prečítajú textové senzory
      - delay: 6s
      # 3) textové senzory (závisia od binárnych)
      - component.update: wind_dir_text
      - component.update: wind_beaufort_text
      - component.update: rain_intensity_text
      - component.update: clothing_recommendation
      - component.update: weather_forecast_text
      - component.update: station_mode_text
      - component.update: rain_cumulative
      - component.update: humidity_stuck_sensor
      # 4) až úplne na záver prepíš referenciu pre porovnanie v ĎALŠOM cykle
      - lambda: |-
          if (id(sht41_humidity).has_state() && !isnan(id(sht41_humidity).state))
            id(prev_humidity) = id(sht41_humidity).state;
  - id: uspat_ltr390
    then:
      - lambda: |-
          uint8_t cmd[] = {0x00, 0x00};
          if (id(busa).write(0x53, cmd, 2) != esphome::i2c::ERROR_OK)
            ESP_LOGW("ltr390", "Nepodarilo sa uspať LTR390");
  - id: check_bme280_chip
    then:
      - lambda: |-
          if (id(busa).write(0x76, nullptr, 0) != esphome::i2c::ERROR_OK) {
            ESP_LOGE("boot", "BME280 nenájdený na 0x76!");
            id(i2c_initialized) = false;
            return;
          }
          uint8_t reg = 0xD0, chip_id = 0;
          if (id(busa).write(0x76, &reg, 1) == esphome::i2c::ERROR_OK &&
              id(busa).read(0x76, &chip_id, 1) == esphome::i2c::ERROR_OK) {
            if (chip_id == 0x60) {
              ESP_LOGI("boot", "BME280 OK (ID: 0x60)");
              id(i2c_initialized) = true;
            } else if (chip_id == 0x58) {
              ESP_LOGW("boot", "BMP280 namiesto BME280 — vlhkosť nebude.");
              id(i2c_initialized) = true;
            } else {
              ESP_LOGW("boot", "Neznámy chip 0x%02X", chip_id);
              id(i2c_initialized) = false;
            }
          } else {
            ESP_LOGE("boot", "Nepodarilo sa prečítať chip ID");
            id(i2c_initialized) = false;
          }
  - id: update_pressure_trend
    mode: single
    then:
      - lambda: |-
          // 1) Ulož aktuálnu vzorku do kruhového bufferu — raz za boot.
          //    (Predtým to robil lambda binárneho senzora rain_prediction, ktorý
          //     bežal AŽ PO výpočte trendu, takže regresia počítala zo starých dát.)
          if (!id(pressure_logged_this_boot) && id(bme280_pressure).has_state()) {
            float p = id(bme280_pressure).state;
            if (!isnan(p) && p > 800.0f) {
              int idx = id(history_index) % 6;
              id(pressure_history)[idx] = p;
              id(pressure_time_index)[idx] = id(boot_count);
              id(history_index) = (id(history_index) + 1) % 6;
              id(pressure_logged_this_boot) = true;
            }
          }
          // 2) Lineárna regresia tlaku v čase → trend v hPa/h
          float sum_x=0,sum_y=0,sum_xx=0,sum_xy=0;
          int n=0;
          float avg_s = id(last_sleep_duration_s);
          for (int i=0; i<6; i++) {
            float p = id(pressure_history)[i];
            int   t = id(pressure_time_index)[i];
            if (!isnan(p) && p > 800.0f && t > 0) {
              float x = (float)t * avg_s / 3600.0f;
              sum_x+=x; sum_y+=p; sum_xx+=x*x; sum_xy+=x*p; n++;
            }
          }
          if (n < 2) { id(pressure_trend_value) = 0.0f; return; }
          float denom = n*sum_xx - sum_x*sum_x;
          if (fabsf(denom) < 0.0001f) { id(pressure_trend_value) = 0.0f; return; }
          id(pressure_trend_value) = clamp((n*sum_xy - sum_x*sum_y)/denom, -10.0f, 10.0f);
          ESP_LOGD("pressure","Trend: %.2f hPa/h (n=%d)", id(pressure_trend_value), n);
  - id: check_and_enter_deep_sleep
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(ota_mode_active) || id(uptime_sensor).state < 60.0f;'
          then:
            - logger.log:
                level: INFO
                tag: "ota"
                format: "Blokujem deep sleep (OTA=%d, uptime=%.0fs)."
                args: ['(int)id(ota_mode_active)', 'id(uptime_sensor).state']
          else:
            - lambda: |-
                // has_state() je true aj keď senzor publikoval NAN — treba isnan()
                float bat = (id(battery_level).has_state() && !isnan(id(battery_level).state))
                            ? id(battery_level).state : 50.0f;
                float wind = (id(wind_speed).has_state() && !isnan(id(wind_speed).state))
                            ? id(wind_speed).state : 0.0f;
                bool  rain  = id(rain_detection).state;
                bool  rain_p = id(rain_prediction).state;
                bool  storm = id(storm_warning).state;
                uint32_t sleep_ms = ${sleep_normal_mode_ms};
                int mode_id = 0;
                if (bat < ${bat_eco_threshold}) {
                  sleep_ms = ${sleep_eco_mode_ms}; mode_id = 2;
                } else if (storm && bat > ${bat_storm_min}) {
                  sleep_ms = ${sleep_storm_mode_ms}; mode_id = 1;
                } else if ((rain || rain_p || wind > ${wind_storm_threshold}) && bat > ${bat_storm_min}) {
                  sleep_ms = ${sleep_storm_mode_ms}; mode_id = 1;
                } else if (bat > ${bat_perf_threshold}) {
                  sleep_ms = ${sleep_perf_mode_ms}; mode_id = 3;
                }
                id(last_sleep_duration_s) = (float)sleep_ms / 1000.0f;
                id(last_sleep_mode) = mode_id;
                const char* names[] = {"Normal","STORM","ECO","PERF"};
                ESP_LOGI("sleep","Režim: %s | %us | Bat: %.0f%% | Wind: %.1fkm/h | Rain:%s Storm:%s",
                  names[mode_id], sleep_ms/1000, bat, wind,
                  rain?"YES":"NO", storm?"YES":"NO");
                id(deep_sleep_control).set_sleep_duration(sleep_ms);
            - deep_sleep.enter: deep_sleep_control
  - id: periodic_sleep_check
    mode: single
    then:
      - if:
          condition:
            and:
              - wifi.connected
              - not:
                  api.connected:
          then:
            - script.execute: check_and_enter_deep_sleep
interval:
  - interval: 15s
    then:
      - script.execute: periodic_sleep_check
