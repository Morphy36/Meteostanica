# Lovelace dashboard "Meteostanica ESP" (url_path: meteostanica-esp, storage mode).
#
# ENTITY ID: zariadenie je v HA premenované na "MeteoStanica - Vonku 1", preto prefix
# `meteostanica_vonku_1_`; novšie entity majú navyše `vonku_`. Pri čistej inštalácii
# budú iné — generuj ich z /api/states, needituj ručne.
#
# VYŽADUJE HACS karty: apexcharts-card, mushroom, windrose-card.
#
# FAREBNÉ GRADIENTY: apexcharts aplikuje per-series `color_threshold` LEN keď je na
# karte `experimental: {color_threshold: true}` — bez toho sa ticho ignoruje.
# Škála ide od studenej modrej po horúcu červenú (teplota), sucho oranžová -> mokro
# modrá (vlhkosť), pokoj zelená -> víchor fialová (vietor).
#
# MERANIA RIADI SHT41. BME280 je len záložná teplota pre prepočet tlaku na hladinu
# mora; jeho vlhkosť sa nepoužíva nikde a slúži len na porovnanie v Diagnostike.
views:
- title: Prehlad
  path: prehlad
  type: sections
  max_columns: 3
  icon: mdi:weather-partly-cloudy
  badges:
  - type: entity
    entity: sensor.meteostanica_vonku_1_vonkajsia_teplota
    show_name: true
    state_content:
    - state
  - type: entity
    entity: sensor.meteostanica_vonku_1_vonkajsia_vlhkost
    show_name: true
  - type: entity
    entity: sensor.meteostanica_vonku_1_tlak_hladina_mora
    show_name: true
  - type: entity
    entity: sensor.meteostanica_vonku_1_uroven_baterie
    show_name: true
  - type: entity
    entity: sensor.meteostanica_vonku_1_vonkajsia_teplota
    name: Data
    show_name: true
    state_content:
    - last_changed
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Teraz
      icon: mdi:weather-partly-cloudy
      heading_style: title
    - type: markdown
      grid_options:
        columns: full
      content: '## {{ states(''sensor.meteostanica_vonku_1_predpoved_pocasia'') }}

        {{ states(''sensor.meteostanica_vonku_1_odporucanie_oblecenia'') }}'
    - type: custom:mushroom-template-card
      entity: sensor.meteostanica_vonku_1_vonkajsia_teplota
      primary: Teplota
      secondary: '{{ states(''sensor.meteostanica_vonku_1_vonkajsia_teplota'') | round(1) }} °C'
      icon: mdi:thermometer
      icon_color: '{% set v = states(''sensor.meteostanica_vonku_1_vonkajsia_teplota'') | float(-999) %}

        {% if v == -999 %}disabled

        {% elif v < 0 %}blue

        {% elif v < 8 %}light-blue

        {% elif v < 16 %}teal

        {% elif v < 22 %}green

        {% elif v < 28 %}orange

        {% elif v < 34 %}deep-orange

        {% elif v < 99 %}red

        {% else %}red{% endif %}'
      tap_action:
        action: more-info
      grid_options:
        columns: 6
    - type: custom:mushroom-template-card
      entity: sensor.meteostanica_vonku_1_pocitova_teplota
