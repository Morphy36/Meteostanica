- title: Diagnostika
  path: diagnostika
  type: sections
  max_columns: 3
  icon: mdi:tools
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Ovladanie
      icon: mdi:tune
      heading_style: title
    - type: markdown
      grid_options:
        columns: full
      content: '### Ako preflashovat stanicu


        Stanica je v deep sleep a hore byva len ~60 s.


        1. Zapni **OTA rezim** nizsie (prezije deep sleep).

        2. Pockaj na najblizsie prebudenie — ostane hore **3 minuty**.

        3. Spusti OTA update; potom sa rezim sam vypne.'
    - type: tile
      entity: switch.meteostanica_vonku_1_ota_rezim_predlzene_budenie
      name: OTA rezim
      icon: mdi:update
      grid_options:
        columns: 12
      features:
      - type: toggle
    - type: tile
      entity: switch.meteostanica_vonku_1_manualne_napajanie_senzorov
      name: Napajanie senzorov
      icon: mdi:power-plug
      grid_options:
        columns: 6
      features:
      - type: toggle
    - type: tile
      entity: switch.meteostanica_vonku_1_vynutit_deep_sleep
      name: Uspat teraz
      icon: mdi:sleep
      grid_options:
        columns: 6
      features:
      - type: toggle
    - type: tile
      entity: switch.meteostanica_vonku_1_restartovat_stanicu
      name: Restart
      icon: mdi:restart
      grid_options:
        columns: 6
      features:
      - type: toggle
    - type: tile
      entity: switch.meteostanica_vonku_1_reset_diagnostiky
      name: Reset diagnostiky + zrazok
      icon: mdi:restore
      grid_options:
        columns: 6
      features:
      - type: toggle
    - type: heading
      heading: Prahy predikcie dazda
      icon: mdi:sliders
      heading_style: subtitle
    - type: entities
      entities:
      - entity: number.meteostanica_vonku_1_prah_poklesu_tlaku
        name: Prah poklesu tlaku (hPa/h)
      - entity: number.meteostanica_vonku_1_prah_vlhkosti_pre_dazd
        name: Prah vlhkosti pre dazd (%)
  - type: grid
    cards:
    - type: heading
      heading: Bateria
      icon: mdi:battery
      heading_style: title
    - type: custom:mushroom-template-card
      entity: sensor.meteostanica_vonku_1_uroven_baterie
      primary: Bateria
      secondary: '{{ states(''sensor.meteostanica_vonku_1_uroven_baterie'') | round(1) }} %'
      icon: mdi:battery
      icon_color: '{% set v = states(''sensor.meteostanica_vonku_1_uroven_baterie'') | float(-999) %}

        {% if v == -999 %}disabled

        {% elif v < 15 %}red

        {% elif v < 35 %}orange

        {% elif v < 60 %}amber

        {% elif v < 101 %}green

        {% else %}green{% endif %}'
      tap_action:
        action: more-info
      grid_options:
        columns: 12
    - type: custom:apexcharts-card
      graph_span: 14d
      experimental:
        color_threshold: true
      header:
        show: true
        title: Bateria 14 dni
        show_states: true
        colorize_states: true
      series:
      - entity: sensor.meteostanica_vonku_1_uroven_baterie
        name: '%'
        type: line
        stroke_width: 2
        float_precision: 0
        color_threshold:
        - value: 0
          color: '#e53935'
        - value: 15
          color: '#fb8c00'
        - value: 35
          color: '#ffc107'
        - value: 60
          color: '#9ccc65'
        - value: 85
          color: '#43a047'
      apex_config:
        chart:
          height: 190
        grid:
          borderColor: '#40404030'
        legend:
          show: false
        stroke:
          curve: smooth
      grid_options:
        columns: full
    - type: entities
      entities:
      - entity: sensor.meteostanica_vonku_1_napatie_baterie
        name: Napatie
        icon: mdi:battery-charging
      - entity: sensor.meteostanica_vonku_1_rezim_stanice
        name: Rezim spanku
        icon: mdi:sleep
  - type: grid
    cards:
    - type: heading
      heading: Pripojenie a beh
      icon: mdi:wifi
      heading_style: title
