        {% if v == -999 %}disabled

        {% elif v < 0 %}blue

        {% elif v < 8 %}light-blue

        {% elif v < 16 %}teal

        {% elif v < 22 %}green

        {% elif v < 28 %}orange

        {% elif v < 34 %}deep-orange

